apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: "public"
  tls:
    - hosts:
      - "{{.Values.host}}"
      secretName: {{ .Values.name }}-tls
  rules:
    - host: "{{.Values.host}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-service
                port:
                  number: 8000
