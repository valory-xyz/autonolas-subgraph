apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: graph-node
  name: graph-node
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: graph-node
  strategy: {}
  template:
    metadata:
      labels:
        io.kompose.service: graph-node
    spec:
      containers:
        - env:
            - name: ETHEREUM_POLLING_INTERVAL
              value: "{{.Values.ethereum.pollingInterval}}"
            - name: GRAPH_ALLOW_NON_DETERMINISTIC_IPFS
              value: "{{.Values.graph.allowNonDeterministicIpfs}}"
            - name: GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER
              value: "{{.Values.ethereum.genesisBlockNumber}}"
            - name: GRAPH_LOG
              value: "{{.Values.graph.log}}"
            - name: GRAPH_START_BLOCK
              value: "{{.Values.graph.startBlock}}"
            - name: ethereum
              value: "{{ .Values.ethereum }}"
            - name: ipfs
              value: "{{ .Values.ipfs.url }}"
            - name: postgres_db
              value: "{{ .Values.postgres.db }}"
            - name: postgres_host
              value: "{{ .Values.postgres.host }}"
            - name: postgres_pass
              value: "{{ .Values.postgres.pass}}"
            - name: postgres_user
              value: "{{ .Values.postgres.user }}"
          image: {{ .Values.images.graphNode.repository }}:{{ .Values.images.graphNode.tag }}
          name: graph-node
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8020
            - containerPort: 8030
            - containerPort: 8040
          resources: {}
      restartPolicy: Always
status: {}
