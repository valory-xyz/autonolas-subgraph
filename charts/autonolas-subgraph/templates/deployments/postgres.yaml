apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-db
  labels:
    io.service: {{ .Values.name }}-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.service: {{ .Values.name }}-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.service: {{ .Values.name }}-db
    spec:
      containers:
        - name: {{ .Values.name }}-db
          image: {{ .Values.images.postgres }}
          args:
            - postgres
            - -cshared_preload_libraries=pg_stat_statements
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_INITDB_ARGS
              value: -E UTF8 --locale=C
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.pass }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.name }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: {{ .Values.name }}-db-volume
              mountPath: /var/lib/postgresql/data
      restartPolicy: Always
      volumes:
        - name: {{ .Values.name }}-db-volume
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-db-claim
