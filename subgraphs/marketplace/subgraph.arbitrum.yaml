  - kind: ethereum
    name: MechNvmSubscriptionTokenUSDC
    network: arbitrum-one
    source:
      abi: MechNvmSubscriptionTokenUSDC
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
