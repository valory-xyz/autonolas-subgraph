      abis:
        - name: MechNvmSubscriptionTokenUSDC
          file: ../../abis/MechNvmSubscriptionTokenUSDC.json
      eventHandlers:
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
