  # we need to support two versions of the ABIs, hence adding two different data sources, the old version (v1)
  # will support b/w the start and end blocks defined in "networks.json", and from the next block the new 
  # abi would be used as the source. 

  # The two ABIs have the following differences:
  # 1. MarketplaceDelivery has `requesters` indexed in the older abi while it is not indexed in the new abi, we don't use the field in order to stay consistent.
  # 2. MarketplaceRequest has `requestDatas` field in the new abi but it's not there in the old one, we don't use this field.
  # 3. Deliver has `requestData` and `deliveryData` in the new abi, while old abi only has `data`, we don't use the `requestData` and have separate handlers so to be type-safe.
  - kind: ethereum
    name: MechMarketplaceV1
    network: gnosis
    source:
      address: "0x735FAAb1c4Ec41128c367AFb5c3baC73509f70bB"
      abi: MechMarketplaceV1
      startBlock: 38661963
      endBlock: 41490893
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CreateMech
        - MarketplaceDelivery
        - MarketplaceDeliveryWithSignatures
        - Request
        - Deliver
        - RequestToMarketplace
        - DeliverForMarketplace
        - MarketplaceRequest
        - Mech
        - Sender
        - Global
        - SetPaymentTypeBalanceTrackers
      abis:
        - name: MechMarketplaceV1
          file: ./abis/marketplace/MechMarketplaceV1.json
        - name: MechFixedPriceNative
          file: ./abis/marketplace/MechFixedPriceNative.json
      eventHandlers:
        - event: CreateMech(indexed address,indexed uint256,indexed address)
          handler: handleCreateMech
        - event: MarketplaceDelivery(indexed address,indexed address[],uint256,bytes32[],bool[])
          handler: handleMarketplaceDelivery
        - event: MarketplaceDeliveryWithSignatures(indexed address,indexed
            address,uint256,bytes32[])
          handler: handleMarketplaceDeliveryWithSignatures
        - event: MarketplaceRequest(indexed address,indexed address,uint256,bytes32[])
          handler: handleMarketplaceRequest
        - event: SetPaymentTypeBalanceTrackers(bytes32[],address[])
          handler: handleSetPaymentTypeBalanceTrackers
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliverWithSignaturesV1
      file: ./src/marketplace/mech-marketplace.ts
  - kind: ethereum
    name: MechMarketplaceV2
    network: gnosis
    source:
      address: "0x735FAAb1c4Ec41128c367AFb5c3baC73509f70bB"
      abi: MechMarketplaceV2
      startBlock: 41490894
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
