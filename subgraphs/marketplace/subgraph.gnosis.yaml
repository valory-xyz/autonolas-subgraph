# Recovery graft: deploy the offchain-IPFS (file data source) request parsing without a full
# resync. Copies the existing deployment's data up to the base block, then re-indexes forward
# with the non-blocking parsing so the IPFS-stall region clears. Base block is within the
# prune:300 window (base head 46,902,091 − 250). Drop this once it has synced past the stall.
