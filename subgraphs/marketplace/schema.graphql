type ParsedRequest @entity(immutable: true) {
  id: ID! # Same as Request.id
  content: String!
  request: Request!
  tool: String!
  prompt: String!
  hash: String!
  questionTitle: String!
}

# Temporary entity for cross-handler state transfer between MechFactory and MechMarketplace events.
# Requires @entity(immutable: false) because Graph Protocol cannot delete immutable entities.
# The store.remove() call in handleCreateMech would fail at runtime if immutability is set to true.
type PendingMechData @entity(immutable: false) {
  id: ID! # mech address as hex string
  maxDeliveryRate: BigInt!
  createdAtBlock: BigInt!
}

type MechAgent @entity(immutable: false) {
  id: ID! # agent Id
  mech: Bytes # address
  address: Bytes # address
  agentHash: Bytes # bytes32
  service: Service
  totalTransactions: BigInt!
}

type MarketplaceMech @entity(immutable: false) {
