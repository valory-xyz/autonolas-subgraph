type MechAgent @entity(immutable: false) {
  id: ID! # agent Id
  mech: Bytes # address
  address: Bytes # address
  agentHash: Bytes # bytes32
  service: MarketplaceService
  totalTransactions: BigInt!
}

type MarketplaceMech @entity(immutable: false) {
  id: ID! # service Id
  mech: Bytes # address
  address: Bytes # address
  agentHash: Bytes # bytes32
  service: MarketplaceService
  totalTransactions: BigInt!
}

type CreateAgent @entity(immutable: true) {
  id: Bytes!
  agentId: BigInt! # uint256
  agentHash: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Transfer @entity(immutable: true) {
  id: Bytes!
  from: Bytes! # address
  to: Bytes! # address
  internal_id: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type UpdateAgentHash @entity(immutable: true) {
  id: Bytes!
  agentId: BigInt! # uint256
  agentHash: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type CreateMultisigWithAgents @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  multisig: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type CreateService @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  configHash: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type DeployService @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ServiceRegistryL2Transfer @entity(immutable: true) {
  id: Bytes!
  from: Bytes! # address
  to: Bytes! # address
  internal_id: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceDelivery @entity(immutable: true) {
  id: Bytes!
  deliveryMech: Bytes! # address
  numDeliveries: BigInt! # uint256
  requestIds: [Bytes!]! # bytes32[]
  deliveredRequests: [Boolean!]! # bool[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceDeliveryWithSignatures @entity(immutable: true) {
  id: Bytes!
  deliveryMech: Bytes! # address
  requester: Bytes! # address
  numDeliveries: BigInt! # uint256
  requestIds: [Bytes!]! # bytes32[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceParamsUpdated @entity(immutable: true) {
  id: Bytes!
  fee: BigInt! # uint256
  minResponseTimeout: BigInt! # uint256
  maxResponseTimeout: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceRequest @entity(immutable: true) {
  id: Bytes!
  priorityMech: Bytes! # address
  requester: Bytes! # address
  numRequests: BigInt! # uint256
  requestIds: [Bytes!]! # bytes32[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type OwnerUpdated @entity(immutable: true) {
  id: Bytes!
  owner: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SetMechFactoryStatuses @entity(immutable: true) {
  id: Bytes!
  mechFactories: [Bytes!]! # address[]
  statuses: [Boolean!]! # bool[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type SetPaymentTypeBalanceTrackers @entity(immutable: true) {
  id: Bytes!
  paymentTypes: [Bytes!]! # bytes32[]
  balanceTrackers: [Bytes!]! # address[]
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
type ActivateRegistration @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Deposit @entity(immutable: true) {
  id: Bytes!
  sender: Bytes! # address
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RegisterInstance @entity(immutable: true) {
  id: Bytes!
  operator: Bytes! # address
  serviceId: BigInt! # uint256
  agentInstance: Bytes! # address
  agentId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type TerminateService @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type UpdateService @entity(immutable: true) {
  id: Bytes!
  serviceId: BigInt! # uint256
  configHash: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Metadata @entity(immutable: false) {
  id: ID!
  serviceId: BigInt! # uint256
  mech: Bytes # address
  metadata: Bytes! # bytes32
  service: MarketplaceService
}

type Mech @entity(immutable: false) {
  id: ID!
  address: Bytes!
  mechFactory: Bytes!
  configHash: Bytes
  owner: Bytes!
  service: MarketplaceService
  totalDeliveriesTransactions: BigInt!
}

type MarketplaceService @entity(immutable: false) {
  id: ID!
  configHash: Bytes!
  latestMultisig: Bytes
  historicalMultisigs: [Bytes!]!
  mechs: [Mech!] @derivedFrom(field: "service")
  metadata: Metadata @derivedFrom(field: "service")
  requests: [MarketplaceRequestIndividual!] @derivedFrom(field: "service")
  deliveries: [MarketplaceDeliveryIndividual!] @derivedFrom(field: "service")
  totalRequests: BigInt!
  totalDeliveries: BigInt!
  agentIds: [BigInt!]!
}

type MarketplaceRequestIndividual @entity(immutable: true) {
  id: ID! # requestId.toHexString()
  requestId: Bytes! # bytes32
  ipfsHash: Bytes # bytes
  sender: MarketplaceSender! # relationship to MarketplaceSender entity
  mech: Bytes! # address
  delivery: MarketplaceDeliveryIndividual @derivedFrom(field: "request") # relationship to MarketplaceDeliveryIndividual entity
  service: MarketplaceService
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceDeliveryIndividual @entity(immutable: true) {
  id: ID! # requestId.toHexString()
  requestId: Bytes! # bytes32
  mech: Bytes! # address
  mechServiceMultisig: Bytes # address
  deliveryRate: BigInt # uint256
  ipfsHash: Bytes # bytes
  sender: Bytes # address
  request: MarketplaceRequestIndividual # relationship to MarketplaceRequestIndividual entity
  isOffChain: Boolean! # bool
  service: MarketplaceService
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type MarketplaceSender @entity(immutable: false) {
  id: Bytes! # address
  requests: [MarketplaceRequestIndividual!]! @derivedFrom(field: "sender")
  totalMarketplaceRequests: BigInt!
  totalOffChainRequests: BigInt! # Requests whose deliveries are captured by the MarketplaceDeliveryWithSignatures event
  totalRequests: BigInt!
  totalTransactions: BigInt!
  totalAtaRequestsTransactions: BigInt!
}

type Global @entity(immutable: false) {
  id: ID!
  totalMechs: BigInt!
  totalMarketplaceRequests: BigInt!
  totalMarketplaceDeliveries: BigInt!
  totalMarketplaceDeliveriesWithSignatures: BigInt!
  totalRequests: BigInt!
  totalDeliveries: BigInt!
  totalTransactions: BigInt!
  totalAtaTransactions: BigInt!
}

type RequestsPerAgent @entity(immutable: false) {
  id: ID!
  requestsCount: BigInt!
}


