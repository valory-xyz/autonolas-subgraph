# Axat's stuff

enum Source {
  MECH
  MARKETPLACE
}

type CreateMech @entity(immutable: false) {
  # Common fields
  id: Bytes!
  mech: Bytes! 
  source: Source # origin discriminator
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!

  # Mech-only fields
  agentId: BigInt
  price: BigInt 

  # Marketplace-only fields
  serviceId: BigInt 
  mechFactory: Bytes 
}

type Request @entity(immutable: false) {
  # Common fields
  id: ID!
  sender: Sender!
  mech: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  delivery: Deliver @derivedFrom(field: "request")
  service: Service

  # Mech-only fields
  requestId: BigInt! 
  ipfsHash: String!
  prompt: String
  tool: String
  questionTitle: String

  # Marketplace-only fields
  requestIdBytes: Bytes # bytes32
  ipfsHashBytes: Bytes # raw bytes
  isMarketplace: Boolean
  isOffChain: Boolean
}

type Deliver @entity(immutable: true) {
  # Common fields
  id: Bytes!
  sender: Bytes! # address
  mech: Bytes! # address
  request: Request
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  service: Service

  # Mech-only fields
  requestId: BigInt! 
  ipfsHash: String! 

  # Marketplace-only fields
  requestIdBytes: Bytes 
  ipfsHashBytes: Bytes 
  mechServiceMultisig: Bytes 
  deliveryRate: BigInt 
  isMarketplace: Boolean
  isOffChain: Boolean
}

type Sender @entity(immutable: false) {
  # Common fields
  id: Bytes! # address
  requests: [Request!] @derivedFrom(field: "sender")

  # Mech-only counters
  totalRequests: Int!
  totalTransactions: Int!
  totalAtaTransactions: Int!

  # Marketplace-only counters
  totalMarketplaceRequests: Int
  totalOffChainRequests: Int
}

type Service @entity(immutable: false) {
  # Common fields
  id: ID!
  serviceId: BigInt! 
  configHash: Bytes 
  latestMultisig: Bytes 
  historicalMultisigs: [Bytes!]!
  totalRequests: BigInt!
  totalDeliveries: BigInt!
  agentIds: [BigInt!]!

  # Common relationships
  requests: [Request!] @derivedFrom(field: "service")
  deliveries: [Deliver!] @derivedFrom(field: "service")

  # Mech-only relationships
  mechs: [MechAgent!] @derivedFrom(field: "service")

  # Marketplace-only relationships
  marketplaceMechs: [MarketplaceMech!] @derivedFrom(field: "service")
}

type TotalRequests @aggregation(intervals: ["hour", "day"], source: "Sender") {
  id: Int8!
  timestamp: Timestamp!
  mech : Mech 
  sum: BigDecimal! @aggregate(fn: "count", arg: "request")
}

type MechDeliveryStats @aggregation(intervals: ["hour", "day"], source: "Deliver") {
  id: Int8!
  timestamp: Timestamp!
  mech : Mech 

  totalDeliveries: BigInt! @aggregate(fn: "count", cumulative: true)
}

type ATAStats @aggregation(intervals: ["hour", "day"], source: "Request") {
  id: Int8!
  timestamp: Timestamp!
  mech : Mech
  totalRequests: BigInt! @aggregate(fn: "count", cumulative: true)
}

