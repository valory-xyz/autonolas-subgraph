# Axat's stuff

enum Source {
  MECH
  MARKETPLACE
}

type CreateMech @entity(immutable: false) {
  # Common fields
  id: Bytes!
  mech: Bytes!
  source: Source # origin discriminator
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!

  # Mech-only fields
  agentId: BigInt
  price: BigInt

  # Marketplace-only fields
  serviceId: BigInt
  mechFactory: Bytes
}

type RequestToMech @entity(immutable: false) {
  id: Bytes!
  ipfsHash: String!
  prompt: String
  tool: String
  questionTitle: String
  request: Request!
}

type RequestToMarketplace @entity(immutable: false) {
  id: Bytes! # requestId
  requestId: Bytes! # bytes32
  ipfsHashBytes: Bytes # raw bytes
  isMarketplace: Boolean
  isOffChain: Boolean
  request: Request!
}

type Request @entity(immutable: false) {
  # Common fields only
  id: Bytes!
  sender: Sender!
  mech: Mech! # Relation to Mech entity (by serviceId)
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!

  delivery: Deliver @derivedFrom(field: "request")
  parsedRequest: ParsedRequest @derivedFrom(field: "request")
  service: Service

  # Relationships to specialized entities
  mechRequest: RequestToMech @derivedFrom(field: "request")
  marketplaceRequest: RequestToMarketplace @derivedFrom(field: "request")

  # Delivery status
  isDelivered: Boolean!
  priorityMech: Bytes # address of the mech that was originally requested
  deliveredByMech: Bytes # address of the mech that delivered the request
}

type DeliverForMech @entity(immutable: true) {
  id: Bytes! # delivery id
  # Mech-only fields
  requestId: Bytes!
  ipfsHash: String!
  deliver: Deliver
}

type DeliverForMarketplace @entity(immutable: true) {
  id: Bytes! # delivery id (requestId)
  requestId: Bytes! # bytes32
  ipfsHashBytes: Bytes
  mechServiceMultisig: Bytes
  deliveryRate: BigInt
  isMarketplace: Boolean
  isOffChain: Boolean
  deliver: Deliver
}

type Deliver @entity(immutable: false) {
  # Common fields only
  id: Bytes!
  sender: Bytes! # address
  mech: Bytes! # address
  request: Request
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  service: Service

  model: String
  toolResponse: String

  # Relationships to specialized entities
  mechDelivery: DeliverForMech @derivedFrom(field: "deliver")
  marketplaceDelivery: DeliverForMarketplace @derivedFrom(field: "deliver")
}

type Sender @entity(immutable: false) {
  # Common fields
  id: Bytes! # address
  requests: [Request!] @derivedFrom(field: "sender")

  # Mech-only counters
  totalRequests: BigInt!
  totalTransactions: BigInt!
  totalAtaTransactions: BigInt!

  # Marketplace-only counters
  totalMarketplaceRequests: BigInt!
  totalOffChainRequests: BigInt!
}

type Service @entity(immutable: false) {
  # Common fields
  id: String!
  serviceId: BigInt! 
  configHash: Bytes 
  latestMultisig: Bytes 
  historicalMultisigs: [Bytes!]!
  totalRequests: BigInt!
  totalDeliveries: BigInt!
  agentIds: [BigInt!]!

  # Common relationships
  requests: [Request!] @derivedFrom(field: "service")
  deliveries: [Deliver!] @derivedFrom(field: "service")

  # Mech-only relationships
  mechs: [MechAgent!] @derivedFrom(field: "service")

  # Marketplace-only relationships
  marketplaceMechs: [MarketplaceMech!] @derivedFrom(field: "service")
}

