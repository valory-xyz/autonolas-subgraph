specVersion: 1.2.0
indexerHints:
  prune: 300
schema:
  file: ./schema.graphql
dataSources:
  ### MechFactory data sources
  # MechFactory contracts emit CreateMech events with maxDeliveryRate BEFORE MechMarketplace's CreateMech.
  # These data sources capture maxDeliveryRate to avoid RPC calls in handleCreateMech.
  - kind: ethereum
    name: MechFactoryFixedPriceNative
    network: matic
    source:
      address: "0x87f89F94033305791B6269AE2F9cF4e09983E56e"
      abi: MechFactoryFixedPriceNative
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PendingMechData
      abis:
        - name: MechFactoryFixedPriceNative
          file: ../../abis/MechFactoryFixedPriceNative.json
      eventHandlers:
        - event: CreateMechFixedPriceNative(indexed address,indexed uint256,uint256)
          handler: handleMechFactoryCreate
      file: ./src/marketplace/mech-factory.ts
  - kind: ethereum
    name: MechFactoryFixedPriceToken
    network: matic
    source:
      address: "0xa0DA53447C0f6C4987964d8463da7e6628B30f82"
      abi: MechFactoryFixedPriceToken
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PendingMechData
      abis:
        - name: MechFactoryFixedPriceToken
          file: ../../abis/MechFactoryFixedPriceToken.json
      eventHandlers:
        - event: CreateMechFixedPriceToken(indexed address,indexed uint256,uint256)
          handler: handleMechFactoryCreate
      file: ./src/marketplace/mech-factory.ts
  - kind: ethereum
    name: MechFactoryFixedPriceTokenUSDC
    network: matic
    source:
      address: "0x85899f9d8C058A5BBBaF344ea0f0b63c0CcBe851"
      abi: MechFactoryFixedPriceTokenUSDC
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PendingMechData
      abis:
        - name: MechFactoryFixedPriceTokenUSDC
          file: ../../abis/MechFactoryFixedPriceTokenUSDC.json
      eventHandlers:
        - event: CreateMechFixedPriceTokenUSDC(indexed address,indexed uint256,uint256)
          handler: handleMechFactoryCreate
      file: ./src/marketplace/mech-factory.ts
  - kind: ethereum
    name: MechFactoryNvmSubscriptionTokenUSDC
    network: matic
    source:
      address: "0x43fB32f25dce34EB76c78C7A42C8F40F84BCD237"
      abi: MechFactoryNvmSubscriptionTokenUSDC
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - PendingMechData
      abis:
        - name: MechFactoryNvmSubscriptionTokenUSDC
          file: ../../abis/MechFactoryNvmSubscriptionTokenUSDC.json
      eventHandlers:
        - event: CreateMechNvmSubscriptionTokenUSDC(indexed address,indexed uint256,uint256)
          handler: handleMechFactoryCreate
      file: ./src/marketplace/mech-factory.ts

  # MechMarketplaceV1 data source for type generation only (no V1 events on Polygon)
  # V1 event signatures differ from V2, so handlers won't match V2 events
  - kind: ethereum
    name: MechMarketplaceV1
    network: matic
    source:
      address: "0x343F2B005cF6D70bA610CD9F1F1927049414B582"
      abi: MechMarketplaceV1
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateMech
        - MarketplaceDelivery
        - MarketplaceDeliveryWithSignatures
        - Deliver
        - MarketplaceRequest
        - Mech
        - Sender
        - Global
      abis:
        - name: MechMarketplaceV1
          file: ../../abis/MechMarketplaceV1.json
        - name: MechFixedPriceNative
          file: ../../abis/MechFixedPriceNative.json
        - name: AggregatorV3Interface
          file: ../../abis/AggregatorV3Interface.json
        - name: BalancerV2Vault
          file: ../../abis/BalancerV2Vault.json
        - name: BalancerV2WeightedPool
          file: ../../abis/BalancerV2WeightedPool.json
        - name: IUniswapV2Pair
          file: ../../abis/IUniswapV2Pair.json
      eventHandlers:
        - event: CreateMech(indexed address,indexed uint256,indexed address)
          handler: handleCreateMech
        - event: MarketplaceDelivery(indexed address,indexed address[],uint256,bytes32[],bool[])
          handler: handleMarketplaceDelivery
        - event: MarketplaceDeliveryWithSignatures(indexed address,indexed
            address,uint256,bytes32[])
          handler: handleMarketplaceDeliveryWithSignatures
        - event: MarketplaceRequest(indexed address,indexed address,uint256,bytes32[])
          handler: handleMarketplaceRequest
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliverWithSignaturesV1
      file: ./src/marketplace/mech-marketplace.ts
  - kind: ethereum
    name: MechMarketplaceV2
    network: matic
    source:
      address: "0x343F2B005cF6D70bA610CD9F1F1927049414B582"
      abi: MechMarketplaceV2
      startBlock: 81028558
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateMech
        - MarketplaceDelivery
        - MarketplaceDeliveryWithSignatures
        - Deliver
        - MarketplaceRequest
        - Mech
        - Sender
        - Global
      abis:
        - name: MechMarketplaceV2
          file: ../../abis/MechMarketplaceV2.json
        - name: MechFixedPriceNative
          file: ../../abis/MechFixedPriceNative.json
        - name: AggregatorV3Interface
          file: ../../abis/AggregatorV3Interface.json
        - name: BalancerV2Vault
          file: ../../abis/BalancerV2Vault.json
        - name: BalancerV2WeightedPool
          file: ../../abis/BalancerV2WeightedPool.json
        - name: IUniswapV2Pair
          file: ../../abis/IUniswapV2Pair.json
      eventHandlers:
        - event: CreateMech(indexed address,indexed uint256,indexed address)
          handler: handleCreateMech
        - event: MarketplaceDelivery(indexed address,address[],uint256,bytes32[],bool[])
          handler: handleMarketplaceDelivery
        - event: MarketplaceDeliveryWithSignatures(indexed address,indexed
            address,uint256,bytes32[])
          handler: handleMarketplaceDeliveryWithSignatures
        - event: MarketplaceRequest(indexed address,indexed address,uint256,bytes32[],bytes[])
          handler: handleMarketplaceRequest
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes,bytes)
          handler: handleDeliverWithSignaturesV2
      file: ./src/marketplace/mech-marketplace.ts
  - kind: ethereum
    name: ServiceRegistryL2
    network: matic
    source:
      address: "0xE3607b00E75f6405248323A9417ff6b39B244b50"
      abi: ServiceRegistryL2
      startBlock: 41783952
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateService
        - Transfer
        - UpdateService
        - Service
        - CreateMultisigWithAgents
        - RegisterInstance
        - TerminateService
      abis:
        - name: ServiceRegistryL2
          file: ../../abis/ServiceRegistryL2.json
      eventHandlers:
        - event: CreateService(indexed uint256,bytes32)
          handler: handleCreateService
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: UpdateService(indexed uint256,bytes32)
          handler: handleUpdateService
        - event: CreateMultisigWithAgents(indexed uint256,indexed address)
          handler: handleCreateMultisigWithAgents
        - event: RegisterInstance(indexed address,indexed uint256,indexed address,uint256)
          handler: handleRegisterInstance
        - event: TerminateService(indexed uint256)
          handler: handleTerminateService
      file: ./src/marketplace/service-registry-l-2.ts
  - kind: ethereum
