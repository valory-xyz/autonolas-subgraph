      file: ./src/marketplace/mech-fixed-price-token.ts
  - kind: ethereum
    name: MechNvmSubscriptionNative
    network: base
    source:
      abi: MechNvmSubscriptionNative
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
