        - Request
      abis:
        - name: MechFixedPriceNative
          file: ../../abis/MechFixedPriceNative.json
        - name: AggregatorV3Interface
          file: ../../abis/AggregatorV3Interface.json
      eventHandlers:
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliver
        - event: Request(indexed address,bytes32,bytes)
          handler: handleRequest
      file: ./src/marketplace/mech-fixed-price-native.ts
  - kind: ethereum
    name: MechFixedPriceToken
    network: optimism
    source:
      abi: MechFixedPriceToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deliver
        - Request
      abis:
        - name: MechFixedPriceToken
          file: ../../abis/MechFixedPriceToken.json
        - name: BalancerV2Vault
          file: ../../abis/BalancerV2Vault.json
        - name: BalancerV2WeightedPool
          file: ../../abis/BalancerV2WeightedPool.json
      eventHandlers:
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliver
        - event: Request(indexed address,bytes32,bytes)
          handler: handleRequest
      file: ./src/marketplace/mech-fixed-price-token.ts
  - kind: ethereum
    name: MechNvmSubscriptionNative
    network: optimism
    source:
      abi: MechNvmSubscriptionNative
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deliver
        - Request
      abis:
        - name: MechNvmSubscriptionNative
          file: ../../abis/MechNvmSubscriptionNative.json
      eventHandlers:
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliver
        - event: Request(indexed address,bytes32,bytes)
          handler: handleRequest
      file: ./src/marketplace/mech-nvm-subscription-native.ts
  - kind: ethereum
    name: MechNvmSubscriptionTokenUSDC
    network: optimism
    source:
      abi: MechNvmSubscriptionTokenUSDC
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deliver
        - Request
      abis:
        - name: MechNvmSubscriptionTokenUSDC
          file: ../../abis/MechNvmSubscriptionTokenUSDC.json
      eventHandlers:
        - event: Deliver(indexed address,indexed address,bytes32,uint256,bytes)
          handler: handleDeliver
        - event: Request(indexed address,bytes32,bytes)
          handler: handleRequest
      file: ./src/marketplace/mech-nvm-subscription-token-usdc.ts
features:
  - fullTextSearch
  - ipfsOnEthereumContracts
