  - kind: ethereum
    name: AgentRegistry
    network: gnosis
    source:
      address: "0xE49CB081e8d96920C38aA7AB90cb0294ab4Bc8EA"
      abi: AgentRegistry
      startBlock: 27911490
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
