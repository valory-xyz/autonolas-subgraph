        - Transfer
        - UpdateAgentHash
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: CreateAgent(indexed uint256,bytes32)
          handler: handleCreateAgent
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: UpdateAgentHash(indexed uint256,bytes32)
          handler: handleUpdateAgentHash
      file: ./src/agent-registry.ts
  - kind: ethereum
    name: ServiceRegistryL2
    network: gnosis
    source:
      address: "0x9338b5153AE39BB89f50468E608eD9d764B755fD"
      abi: ServiceRegistryL2
      startBlock: 27871084
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ActivateRegistration
        - ServiceRegistryL2Approval
        - ServiceRegistryL2ApprovalForAll
        - ServiceRegistryL2BaseURIChanged
        - CreateMultisigWithAgents
        - CreateService
        - DeployService
        - Deposit
        - RegisterInstance
        - TerminateService
        - ServiceRegistryL2Transfer
        - UpdateService
      abis:
        - name: ServiceRegistryL2
          file: ./abis/ServiceRegistryL2.json
      eventHandlers:
        - event: CreateMultisigWithAgents(indexed uint256,indexed address)
          handler: handleCreateMultisigWithAgents
        - event: CreateService(indexed uint256,bytes32)
          handler: handleCreateService
        - event: DeployService(indexed uint256)
          handler: handleDeployService
        - event: Deposit(indexed address,uint256)
          handler: handleDeposit
        - event: RegisterInstance(indexed address,indexed uint256,indexed address,uint256)
          handler: handleRegisterInstance
        - event: TerminateService(indexed uint256)
          handler: handleTerminateService
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: UpdateService(indexed uint256,bytes32)
          handler: handleUpdateService
      file: ./src/service-registry-l-2.ts
templates:
  - name: AgentMech
    kind: ethereum/contract
    network: gnosis
    source:
      abi: AgentMech
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Request
        - Deliver
      abis:
        - name: AgentMech
          file: ./abis/AgentMech.json
      eventHandlers:
        - event: Request(indexed address,uint256,bytes)
          handler: handleRequest
        - event: Deliver(indexed address,uint256,bytes)
          handler: handleDeliver
      file: ./src/agent-mech.ts
