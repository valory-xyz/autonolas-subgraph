  # Polymarket v2 collateral adapters. Trader (PR valory-xyz/trader#929) routes
  # redemptions through these adapters so the Safe receives pUSD directly. The
  # legacy CTF / NegRiskAdapter PayoutRedemption events still fire but with
  # `redeemer = adapter` — those fall through TraderAgent.load == null in our
  # existing handlers, so no double-counting. Actual Safe payout is in the
  # adapter-side PositionsRedeemed event (`initiator` = Safe, `payout` in pUSD).
  #
  # The two address pairs below cover both deploy phases (see graft note above):
  #   • Current addresses (PR #935, live from 2026-05-01 15:00 UTC) — used by
  #     phase 1 from graft.block forward and by phase 2 from same block forward.
  #   • *Old addresses (PR #929, live ~2026-04-30 → 2026-05-01) — inert in
  #     phase 1 (window is fully behind graft.block), engaged in phase 2 to
  #     backfill the historical [86219367, 86386437] window.
  # Same ABI, same handler.
  - kind: ethereum/contract
    name: CtfCollateralAdapter
    network: matic
    source:
      address: "0xAdA100Db00Ca00073811820692005400218FcE1f"
      abi: CtfCollateralAdapter
      startBlock: 86386437
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/collateral-adapter.ts
      entities:
        - TraderAgent
        - MarketParticipant
        - Question
        - Global
        - DailyProfitStatistic
        - PayoutRedemption
      abis:
        - name: CtfCollateralAdapter
          file: ../../abis/CtfCollateralAdapter.json
      eventHandlers:
        - event: PositionsRedeemed(indexed address,indexed bytes32,uint256[],uint256)
          handler: handlePositionsRedeemed
  - kind: ethereum/contract
    name: NegRiskCtfCollateralAdapter
    network: matic
