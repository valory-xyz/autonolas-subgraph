specVersion: 1.0.0
indexerHints:
  prune: 300
features:
  - grafting
# Two-phase deploy plan:
#
#   Phase 1 (this commit) — chain-graft on top of the v2-grafted deployment
#   (which itself grafts on QmZXBjgbyCNCrrB51kEPtNHtzzwwNHy8GnSGmLFHFGDc5Z @
#   85952819). We can't reuse that v1 base directly — it has indexed far past
#   its 300-block prune window — so we graft on the current v2 head instead.
#   Fast deploy, ships the collateral-adapter handlers forward from now.
#   Trade-off: adapter activity in [85952819, this block] is NOT backfilled —
#   that's the ~6-day window of historical adapter redemptions (post-v2-cutover
#   on 2026-04-28, including the PR #929 deploy on 2026-04-30 and the PR #935
#   address swap on 2026-05-01) that the existing deployment silently dropped.
#   Per-agent `totalPayout` will be understated until phase 2.
#
#   Phase 2 (later) — drop grafting and re-index from scratch on a fresh
#   deployment hash. Both `CollateralAdapter*` and `CollateralAdapter*Old`
#   dataSources then run over the full chain history, contiguous via the
#   [86219367, 86386437] / [86386437, ∞) split below, producing correct
#   per-agent `totalPayout`. The grafted deployment is retired at that point.
#
# Pause base → commit this block → deploy grafted subgraph → verify → resume
# base. If the deploy slips and the base resumes + advances, re-pause and bump
# this block + the two `CollateralAdapter*` startBlocks (and the matching
# endBlock on the two `CollateralAdapter*Old` entries).
graft:
  base: QmUMaqgrL8tTJmrSTbajqG6TFhdL2etFYJQ4EjmdjuaN6T
  block: 86386437
schema:
  file: ./schema.graphql
