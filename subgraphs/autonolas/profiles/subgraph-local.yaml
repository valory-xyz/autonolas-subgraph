specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # Component Registry
  - kind: ethereum
    name: ComponentRegistry
    network: mainnet
    source:
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: ComponentRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateUnit
        - UpdateUnitHash
        - Transfer
      abis:
        - name: ComponentRegistry
          file: ./abis/ComponentRegistry.json
      eventHandlers:
        - event: CreateUnit(uint256,uint8,bytes32)
          handler: handleCreateComponent
        - event: UpdateUnitHash(uint256,uint8,bytes32)
          handler: handleUpdateComponent
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleComponentTransfer
      file: ./src/registry.ts

  # Agent Registry
  - kind: ethereum
    name: AgentRegistry
    network: mainnet
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      abi: AgentRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateUnit
        - UpdateUnitHash
        - Transfer
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: CreateUnit(uint256,uint8,bytes32)
          handler: handleCreateAgent
        - event: UpdateUnitHash(uint256,uint8,bytes32)
          handler: handleUpdateAgent
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleUpdateAgent
      file: ./src/registry.ts
 
  # Service Registry
  - kind: ethereum
    name: ServiceRegistry
    network: mainnet
    source:
      address: "0x998abeb3E57409262aE5b751f60747921B33613E"
      abi: ServiceRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateService
        - UpdateService
        - Transfer
        - ActivateRegistration
        - RegisterInstance
        - DeployService
        - TerminateService
        - OperatorUnbond
      abis:
        - name: ServiceRegistry
          file: ./abis/ServiceRegistry.json
      eventHandlers:
        - event: CreateService(indexed uint256)
          handler: handleCreateService
        - event: UpdateService(indexed uint256,bytes32)
          handler: handleUpdateService
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleServiceTransfer
        - event: ActivateRegistration(indexed uint256)
          handler: handleActivateRegistration
        - event: RegisterInstance(indexed address,indexed uint256,indexed address,uint256)
          handler: handleRegisterInstance
        - event: DeployService(indexed uint256)
          handler: handleDeployService
        - event: TerminateService(indexed uint256)
          handler: handleTerminateService
        - event: OperatorUnbond(indexed address,indexed uint256)
          handler: handleOperatorUnbond
      file: ./src/registry.ts
features:
  - fullTextSearch
  - ipfsOnEthereumContracts
