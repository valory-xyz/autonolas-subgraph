specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ServiceRegistryL2
    network: base
    source:
      address: "0x3C1fF68f5aa342D296d4DEe4Bb1cACCA912D95fE"
      abi: ServiceRegistryL2
      startBlock: 10827670
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateService
        - UpdateService
        - Transfer
        - ActivateRegistration
        - RegisterInstance
        - DeployService
        - TerminateService
        - OperatorUnbond
        - Multisig
      abis:
        - name: ServiceRegistryL2
          file: ./abis/ServiceRegistryL2.json
        - name: GnosisSafe
          file: ../../abis/GnosisSafe.json
      eventHandlers:
        - event: CreateService(indexed uint256,bytes32)
          handler: handleCreateService
        - event: UpdateService(indexed uint256,bytes32)
          handler: handleUpdateService
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleServiceTransfer
        - event: ActivateRegistration(indexed uint256)
          handler: handleActivateRegistration
        - event: RegisterInstance(indexed address,indexed uint256,indexed address,uint256)
          handler: handleRegisterInstance
        - event: DeployService(indexed uint256)
          handler: handleDeployService
        - event: TerminateService(indexed uint256)
          handler: handleTerminateService
        - event: OperatorUnbond(indexed address,indexed uint256)
          handler: handleOperatorUnbond
        - event: CreateMultisigWithAgents(indexed uint256,indexed address)
          handler: handleCreateMultisigWithAgents
      file: ./src/registryL2.ts
templates:
  - kind: ethereum/contract
    name: GnosisSafe
    network: base
    source:
      abi: GnosisSafe
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/safe.ts
      entities:
        - DailyActivity
        - Multisig
        - Service
      abis:
        - name: GnosisSafe
          file: ../../abis/GnosisSafe.json
      eventHandlers:
        - event: SafeReceived(indexed address,uint256)
          handler: handleSafeReceived
features:
  - fullTextSearch
  - ipfsOnEthereumContracts
