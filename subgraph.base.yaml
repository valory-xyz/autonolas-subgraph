specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: MechMarketplace
    network: base
    source:
      address: "0xf24eE42edA0fc9b33B7D41B06Ee8ccD2Ef7C5020"
      abi: MechMarketplace
      startBlock: 26642705
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateMech
      abis:
        - name: MechMarketplace
          file: ./abis/MechMarketplace.json
      eventHandlers:
        - event: CreateMech(indexed address,indexed uint256,indexed address)
          handler: handleCreateMech
      file: ./src/mech-marketplace.ts
  - kind: ethereum
    name: ServiceRegistryL2
    network: base
    source:
      address: "0x3C1fF68f5aa342D296d4DEe4Bb1cACCA912D95fE"
      abi: ServiceRegistryL2
      startBlock: 10827380
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateService
        - Transfer
        - UpdateService
      abis:
        - name: ServiceRegistryL2
          file: ./abis/ServiceRegistryL2.json
      eventHandlers:
        - event: CreateService(indexed uint256,bytes32)
          handler: handleCreateService
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: UpdateService(indexed uint256,bytes32)
          handler: handleUpdateService
      file: ./src/service-registry-l-2.ts
