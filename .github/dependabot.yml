# .github/dependabot.yml
#
# Dependabot configuration. Per the plan in
# `.plans/supply-chain-update.md`, we enumerate every `package.json`
# directory explicitly so version drift surfaces per-subgraph rather
# than only at root. Heterogeneous graph-cli versions across subgraphs
# (0.64.0 → 0.98.x) mean root coverage alone would not catch sub-tree
# drift.
#
# `versioning-strategy: increase` rewrites the version in package.json,
# preserving the no-carets invariant established in PR 1. Dependabot
# will not re-introduce ^/~ prefixes.
#
# Note on PR volume: Dependabot may open ~10–15 PRs in the first weeks
# (especially for `@graphprotocol/graph-cli` transitive bumps). Triage
# weekly. Once Tier 3 (graph-cli convergence) lands, version drift
# across subgraphs reduces and Dependabot noise drops.
#
# See SUPPLY-CHAIN-SECURITY.md §4.

version: 2
updates:
  # Root package.json (graph-cli for scripts/deploy.ts, @clack/prompts).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels: [dependencies, supply-chain]

  - package-ecosystem: npm
    directory: /subgraphs/autonolas
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]

  - package-ecosystem: npm
    directory: /subgraphs/autonolas-base
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]

  - package-ecosystem: npm
    directory: /subgraphs/babydegen-mode
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]

  - package-ecosystem: npm
    directory: /subgraphs/marketplace
    schedule:
      interval: weekly
