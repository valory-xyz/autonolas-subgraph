    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]

  # GitHub Actions (workflows reference SHA-pinned actions; Dependabot
  # rewrites SHAs to track tag floats).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [github-actions, supply-chain]
