name: Deploy Subgraph (Reusable)

on:
  workflow_call:
    inputs:
      subgraph_name:
        description: "Name of the subgraph to deploy"
        required: true
        type: string
      working_directory:
        description: "Working directory for the subgraph"
        required: true
        type: string
      manifest_file:
        description: "Subgraph manifest file name"
        required: true
        type: string
      version:
        description: "Version to deploy"
        required: true
        type: string
    secrets:
      GRAPH_NODE_USER:
        required: true
      GRAPH_NODE_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - name: Prepare environment
        env:
          VERSION: ${{ inputs.version }}
          GRAPH_NODE_USER: ${{ secrets.GRAPH_NODE_USER }}
          GRAPH_NODE_PASSWORD: ${{ secrets.GRAPH_NODE_PASSWORD }}
        run: |
          # Export variables for subsequent steps
          echo "SUBGRAPH_MANIFEST=${{ inputs.manifest_file }}" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SUBGRAPH_NAME=${{ inputs.subgraph_name }}-${VERSION//./_}" >> $GITHUB_ENV

          # Create masked node URL
          GRAPH_NODE_URL="https://${GRAPH_NODE_USER}:${GRAPH_NODE_PASSWORD}@admin.subgraph.autonolas.tech"
          echo "::add-mask::$GRAPH_NODE_URL"
          echo "GRAPH_NODE_URL=$GRAPH_NODE_URL" >> $GITHUB_ENV

      - name: Install subgraph packages
        working-directory: ${{ inputs.working_directory }}
        run: yarn install

      - name: Generate code
        working-directory: ${{ inputs.working_directory }}
        run: yarn graph codegen ${{ env.SUBGRAPH_MANIFEST }}

      - name: Build subgraph
        working-directory: ${{ inputs.working_directory }}
        run: yarn graph build ${{ env.SUBGRAPH_MANIFEST }}

      - name: Create subgraph
        working-directory: ${{ inputs.working_directory }}
        continue-on-error: true # Subgraph may already exist
        run: yarn graph create --node=${{ env.GRAPH_NODE_URL }} ${{ env.SUBGRAPH_NAME }}

      - name: Deploy subgraph
        working-directory: ${{ inputs.working_directory }}
        run: |
          yarn graph deploy \
            --node=${{ env.GRAPH_NODE_URL }} \
            --ipfs=https://registry.autonolas.tech \
            ${{ env.SUBGRAPH_NAME }} \
            ${{ env.SUBGRAPH_MANIFEST }} \
            -l ${{ env.VERSION }}

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Subgraph deployed successfully"
          echo "Subgraph name: ${{ env.SUBGRAPH_NAME }}"
          echo "Version: ${{ env.VERSION }}"
          echo "URL: https://subgraph.autonolas.tech/subgraphs/name/${{ env.SUBGRAPH_NAME }}"
