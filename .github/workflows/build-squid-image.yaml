name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["squids/predict-polymarket/**", ".github/workflows/build-squid-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          # registry + credentials supplied by the infra team as repo secrets
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./squids/predict-polymarket
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid:latest
