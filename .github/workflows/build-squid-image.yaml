name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["squids/predict-polymarket/**", ".github/workflows/build-squid-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          # Docker Hub (login-action default server). DOCKER_REGISTRY below is
          # the image NAMESPACE (e.g. "valory"), not a server address — do not
          # pass it to login.
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: tags
        # :sha always; :latest always; :vX.Y.Z additionally when the build was
        # triggered by pushing a git tag — so releases produce a matching image.
        run: |
          IMG="${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid"
          TAGS="$IMG:${{ github.sha }},$IMG:latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,$IMG:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./squids/predict-polymarket
          push: true
          # our nodes are amd64; keeps a stray arm64 runner (or local buildx
          # defaults) from ever producing an exec-format-error image
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
