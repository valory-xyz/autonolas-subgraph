name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["squids/predict-polymarket/**", ".github/workflows/build-squid-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          # Docker Hub (login-action default server). DOCKER_REGISTRY below is
          # the image NAMESPACE (e.g. "valory"), not a server address — do not
          # pass it to login.
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./squids/predict-polymarket
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid:latest
