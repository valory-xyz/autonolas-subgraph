name: build-image

run-name: Build squid image ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g., v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$INPUT_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version: '$INPUT_VERSION' (expected e.g. v0.1.0)"
            exit 1
          fi

      - name: Validate branch
        # images are deployed to production, so only build from main (same
        # gate as production subgraph deploys)
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "❌ Image builds must run from main (got: $CURRENT_BRANCH)"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          # Docker Hub (login-action default server). DOCKER_REGISTRY below is
          # the image NAMESPACE (e.g. "valory"), not a server address — do not
          # pass it to login.
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute image tags
        id: tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          IMG="${{ secrets.DOCKER_REGISTRY }}/predict-polymarket-squid"
          echo "tags=$IMG:${{ github.sha }},$IMG:latest,$IMG:$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./squids/predict-polymarket
          push: true
          # our nodes are amd64; keeps a stray arm64 runner (or local buildx
          # defaults) from ever producing an exec-format-error image
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
