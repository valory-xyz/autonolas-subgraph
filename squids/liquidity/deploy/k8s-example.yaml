# Example spec for the infra team — adapt to the ArgoCD/Helm conventions of
# internal-infrastructure. One image (squids/Dockerfile), three workloads.
# Names carry the chain because one image serves any configured chain; a
# second chain is a second copy of this file with its own database.
#
# Required env, split into two Secrets so only the processor sees the
# vendor credentials:
#   Secret liquidity-robinhood-squid-db   (all three workloads):
#     DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS  -> squid Postgres
#   Secret liquidity-robinhood-squid-data (processor ONLY):
#     LIQUIDITY_CHAIN    -> "robinhood" (key into src/constants.ts CHAINS)
#     INGEST_SOURCE      -> "portal" or "rpc". robinhood-mainnet is a PRIVATE
#       portal dataset (the public portal answers 404): use "portal" only with
#       the private portal URL + key below; otherwise "rpc" ingests from
#       RPC_HTTP (~60 blocks/s on this chain — fine at the head, slow for a
#       backfill).
#     SQD_PORTAL_URL     -> private SQD Portal dataset URL for robinhood-mainnet
#     SQD_PORTAL_API_KEY -> private portal key (x-api-key header)
#     RPC_HTTP           -> Robinhood Chain JSON-RPC, used for the pair's
#       token0/token1 (once), the Chainlink ETH/USD read (at most hourly), and
#       ingestion when INGEST_SOURCE=rpc. On a Balancer chain also the pool
#       id / swap fee (once) and getPoolTokens at every mint/burn block, so
#       ARCHIVE-capable there. https://rpc-gate.autonolas.tech/robinhood-rpc/
#       is archive-capable; rpc.mainnet.chain.robinhood.com is pruned.
#     RPC_HTTP_FALLBACK  -> optional second endpoint for the contract reads.
#     RPC_RATE_LIMIT     -> optional requests/second cap for RPC ingestion.
#
# Postgres: any small instance (1 vCPU / 2 GB / 10 GB). Own instance —
# do NOT share the graph-node database server.
---
# 1. one-shot schema migration (run once per schema change, before processor)
apiVersion: batch/v1
kind: Job
metadata:
  name: liquidity-robinhood-squid-migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: <REGISTRY>/liquidity-squid:<TAG>
          command: ["npx", "squid-typeorm-migration", "apply"]
          envFrom: [{ secretRef: { name: liquidity-robinhood-squid-db } }]
---
# 2. processor (the indexer). Single replica ALWAYS — concurrent processors
# on one DB corrupt the cursor. Recreate strategy, not RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-robinhood-squid-processor
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: liquidity-robinhood-squid-processor } }
  template:
    metadata:
      labels: { app: liquidity-robinhood-squid-processor }
    spec:
      containers:
        - name: processor
          image: <REGISTRY>/liquidity-squid:<TAG>
          envFrom:
            - { secretRef: { name: liquidity-robinhood-squid-db } }
            - { secretRef: { name: liquidity-robinhood-squid-data } }
          env:
            - { name: PROMETHEUS_PORT, value: "3000" }
          ports:
            - { containerPort: 3000, name: metrics }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
# 3. GraphQL API. Stateless; scale freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-robinhood-squid-api
spec:
  replicas: 2
  selector: { matchLabels: { app: liquidity-robinhood-squid-api } }
  template:
    metadata:
      labels: { app: liquidity-robinhood-squid-api }
    spec:
      containers:
        - name: api
          image: <REGISTRY>/liquidity-squid:<TAG>
          command:
            [
              "npx",
              "squid-graphql-server",
              "--dumb-cache",
              "in-memory",
              "--dumb-cache-ttl",
              "1000",
              "--dumb-cache-size",
              "100",
              "--dumb-cache-max-age",
              "1000",
            ]
          envFrom: [{ secretRef: { name: liquidity-robinhood-squid-db } }]
          env:
            - { name: GQL_PORT, value: "4350" }
          ports:
            - { containerPort: 4350, name: http }
          readinessProbe:
            httpGet: { path: /graphql, port: 4350 }
---
apiVersion: v1
kind: Service
metadata:
  name: liquidity-robinhood-squid-api
spec:
  selector: { app: liquidity-robinhood-squid-api }
  ports:
    - { port: 80, targetPort: 4350 }
