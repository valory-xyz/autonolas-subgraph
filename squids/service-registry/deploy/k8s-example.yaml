# Example spec for the infra team — adapt to the ArgoCD/Helm conventions of
# internal-infrastructure. One image (see Dockerfile), three workloads.
#
# Required env, split into two Secrets so only the processor sees the
# vendor credentials:
#   Secret service-registry-squid-db   (all three workloads):
#     DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS  -> squid Postgres
#   Secret service-registry-squid-data (processor ONLY):
#     SQD_PORTAL_URL     -> private SQD Portal dataset URL (robinhood-mainnet)
#     SQD_PORTAL_API_KEY -> private portal key (x-api-key header). Required:
#       robinhood-mainnet is not on the public portal at all.
#
# No RPC: this squid reads event logs only.
#
# Postgres: any small instance (1 vCPU / 2 GB / 10 GB). Own instance —
# do NOT share the graph-node database server.
---
# 1. one-shot schema migration (run once per schema change, before processor)
apiVersion: batch/v1
kind: Job
metadata:
  name: service-registry-squid-migrate
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: <REGISTRY>/service-registry-squid:<TAG>
          command: ["npx", "squid-typeorm-migration", "apply"]
          envFrom: [{ secretRef: { name: service-registry-squid-db } }]
---
# 2. processor (the indexer). Single replica ALWAYS — concurrent processors
# on one DB corrupt the cursor. Recreate strategy, not RollingUpdate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry-squid-processor
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: service-registry-squid-processor } }
  template:
    metadata:
      labels: { app: service-registry-squid-processor }
    spec:
      containers:
        - name: processor
          image: <REGISTRY>/service-registry-squid:<TAG>
          envFrom:
            - { secretRef: { name: service-registry-squid-db } }
            - { secretRef: { name: service-registry-squid-data } }
          env:
            - { name: PROMETHEUS_PORT, value: "3000" }
          ports:
            - { containerPort: 3000, name: metrics }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
# 3. GraphQL API. Stateless; scale freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry-squid-api
spec:
  replicas: 2
  selector: { matchLabels: { app: service-registry-squid-api } }
  template:
    metadata:
      labels: { app: service-registry-squid-api }
    spec:
      containers:
        - name: api
          image: <REGISTRY>/service-registry-squid:<TAG>
          command:
            [
              "npx",
              "squid-graphql-server",
              "--dumb-cache",
              "in-memory",
              "--dumb-cache-ttl",
              "1000",
              "--dumb-cache-size",
              "100",
              "--dumb-cache-max-age",
              "1000",
            ]
          envFrom: [{ secretRef: { name: service-registry-squid-db } }]
          env:
            - { name: GQL_PORT, value: "4350" }
          ports:
            - { containerPort: 4350, name: http }
          readinessProbe:
            httpGet: { path: /graphql, port: 4350 }
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry-squid-api
spec:
  selector: { app: service-registry-squid-api }
  ports:
    - { port: 80, targetPort: 4350 }
