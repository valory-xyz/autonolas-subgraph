# Port of studio main ab3ac860ada32aa16121c3637816cba3f8075f1b.
# Hex bytes use String; numeric arrays use decimal String arrays (SQD codegen limit).
# Scalar integers retain BigInt. IDs retain the source encodings; see README.

type InstanceCreated @entity {
  id: ID!
  sender: String! # address
  instance: String! # address
  implementation: String! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

type InstanceRemoved @entity {
  id: ID!
  instance: String! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

type InstanceStatusChanged @entity {
  id: ID!
  instance: String! # address
  isEnabled: Boolean! # bool
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

