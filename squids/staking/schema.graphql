type StakingContract @entity {
  id: ID! # instance address
  sender: String! # address
  instance: String! # address
  implementation: String! # address
  # Nullable below: implementations expose different getters
  stakingManager: String
  stakingToken: String
  serviceRegistryTokenUtility: String
  version: String
  configComplete: Boolean! # false when a getter reverted and the field holds a default
  isOlasStaking: Boolean! # stakingToken matches this network's OLAS
  eventsIndexed: Boolean! # false when the implementation's events do not match the manifest
  metadataHash: String!
  maxNumServices: BigInt!
  rewardsPerSecond: BigInt!
  minStakingDeposit: BigInt!
  minStakingDuration: BigInt!
  maxNumInactivityPeriods: BigInt!
  livenessPeriod: BigInt!
  timeForEmissions: BigInt!
  numAgentInstances: BigInt!
  agentIds: [String!]!
  threshold: BigInt!
  configHash: String!
  proxyHash: String!
  serviceRegistry: String!
  activityChecker: String!
}

type RewardUpdate @entity {
  id: ID!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
  type: String! # "Claimable" or "Claimed"
  amount: BigInt!
}

type Service @entity {
  id: ID!
  currentOlasStaked: BigInt!
  currentStakeAmount: BigInt! # recorded on stake, subtracted on unstake
  hasOlasStake: Boolean! # has staked in an OLAS contract at least once
  olasRewardsEarned: BigInt!
  olasRewardsClaimed: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  global: Global!
  latestStakingContract: String
  totalEpochsParticipated: Int!
  rewardsHistory: [ServiceRewardsHistory!]! @derivedFrom(field: "service")
}

type ServiceRewardsHistory @entity {
  id: ID! # {serviceId}-{contractAddress}-{epoch}
  service: Service!
  epoch: BigInt!
  contractAddress: String!
  checkpoint: Checkpoint
  rewardAmount: BigInt!
  checkpointedAt: BigInt
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

type ActiveServiceEpoch @entity {
  id: ID! # {contractAddress}-{epoch}
  contractAddress: String!
  epoch: BigInt!
  activeServiceIds: [String!]!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}

type Global @entity {
  id: ID!
  cumulativeOlasStaked: BigInt!
  cumulativeOlasUnstaked: BigInt!
  currentOlasStaked: BigInt!
  totalRewards: BigInt! # cumulative rewards earned
  totalRewardsClaimed: BigInt! # cumulative rewards paid out
  lastActiveDayTimestamp: BigInt!
  services: [Service!]! @derivedFrom(field: "global")
}

type CumulativeDailyStakingGlobal @entity {
  id: ID!
  timestamp: BigInt!
  block: BigInt!
  totalRewards: BigInt!
  totalRewardsClaimed: BigInt!
  numServices: Int!
  medianCumulativeRewards: BigInt!
}