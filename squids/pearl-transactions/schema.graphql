# SQD port of the pearl-transactions subgraph schema (v2 / v0.0.7 shape —
# separate BondMovement ledger, AGENT_OLAS_TO_MASTER pre-split).
#
# Dialect deltas from the graph-node schema, applied throughout:
# - `Bytes` ids/fields -> `String` hex, lowercase (SQD normalizes log
#   addresses to lowercase; every write must match).
# - `@entity(immutable: true|false)` -> plain `@entity`. Immutability was a
#   graph-node storage optimization (skipping block-range versioning); SQD's
#   TypeORM store has no equivalent concept, so the distinction disappears.
#   The comments explaining WHY a table was immutable are kept — they still
#   document the write pattern the handlers must honour.
# - Queried via OpenReader, not the Graph dialect: `limit`/`offset` instead
#   of `first`/`skip`, `where: {id_eq: ...}`, `masterSafeById(id:)`. See
#   MIGRATION.md.
#
# Dropped relative to the subgraph: `PendingBondCounter`, `PendingBondRow`
# and `AgentBondAttributionGuard`. All three are keyed by tx hash — they
# exist only because graph-node handlers cannot share state across the
# events of one transaction. A SQD batch handler sees every log of a block
# in memory at once (and SQD never splits a block across batches), so the
# bond-attribution queue lives in a plain per-tx Map in the handler instead
# of costing three Postgres tables of write amplification. `ServiceIndex`
# and `PendingRegistration` are NOT dropped: they span transactions.

# --- Structural -------------------------------------------------------

type MasterSafe @entity {
  id: ID! # Master Safe address
  network: String!
  # Owner derivation: Master EOA via one-shot getOwners() eth_call at first
  # sighting; updated by Safe.AddedOwner / RemovedOwner / ChangedThreshold.
  masterEoa: String! # owners[0] at first sighting
  owners: [String!]! # full owner list at first sighting
  threshold: BigInt! # signature threshold (Pearl default: 1)
  services: [Service!]! @derivedFrom(field: "masterSafe")
  agentSafes: [AgentSafe!]! @derivedFrom(field: "masterSafe")
  firstSeenTimestamp: BigInt!
  firstSeenBlock: BigInt! # internal provenance: when we first saw this Safe
  # SINGLE SOURCE OF TRUTH for opening balances: this indexer emits NO
  # opening-balance row — the wallet UI renders a "History starts here"
  # divider at this block and fetches opening balances itself via archive
  # RPC (balanceOf for ERC-20, eth_getBalance for native) at exactly
  # historyFloorBlock. Equal to firstSeen* in practice; named distinctly
  # because historyFloor* is the consumer-facing UI contract while
  # firstSeen* is internal provenance.
  historyFloorBlock: BigInt!
  historyFloorTimestamp: BigInt!
  lastActivityTimestamp: BigInt!
  # Flips true the first time a live ERC-20 / native inbound from masterEoa
  # is observed after first sighting. classifyTransfer tags that first
  # qualifying hop SAFE_SETUP_TRANSFER (subsequent ones MASTER_FUNDING_IN).
  setupTransferSeen: Boolean!
}

type AgentSafe @entity {
  id: ID! # Agent Safe (service multisig) address
  masterSafe: MasterSafe
  service: Service!
  createdTimestamp: BigInt!
}

type Service @entity {
  id: ID! # serviceId (decimal string)
  serviceId: BigInt! # numeric service id (use this for display)
  agentIds: [Int!]! # deduplicated; from RegisterInstance — consumer filter
  operators: [String!]! # deduplicated; sub-cohort filter
  masterSafe: MasterSafe
  agentSafe: AgentSafe
  state: String! # REGISTERED|DEPLOYED|STAKED|UNSTAKED|TERMINATED
  nftCustodian: String # current ERC-721 owner
  currentStakingContract: StakingContract # set on stake, cleared on unstake
  totalOlasRewardsClaimed: BigInt! # cumulative across stake-cycles
  registeredTimestamp: BigInt!
  updatedTimestamp: BigInt!
}

# Staking proxy / "staking contract" — created on
# StakingFactory.InstanceCreated for any allowed implementation. Config
# snapshot is captured via contract calls at creation time; nothing updates
# afterward.
type StakingContract @entity {
  id: ID! # staking proxy address
  implementation: String!
  minStakingDeposit: BigInt!
  numAgentInstances: BigInt!
  createdBlock: BigInt!
  createdTimestamp: BigInt!
}

# --- Ledger -----------------------------------------------------------

enum FundsCategory {
  # Semantic (registry + SRTU)
  SAFE_DEPLOYED # First sighting of a Master Safe — "Setup complete" anchor (amount=0)
  SERVICE_BOND_DEPOSIT # SRTU.TokenDeposit; fires twice per stake-cycle (activate + register)
  SERVICE_BOND_REFUND # SRTU.TokenRefund; fires twice per unstake-cycle (terminate + unbond)
  # Staking
  STAKING_REWARD_CLAIM # StakingProxy.RewardClaimed → Agent Safe
  UNSTAKE_REWARD # StakingProxy.ServiceUnstaked / ServiceForceUnstaked → Agent Safe
  SERVICE_EVICTED # StakingProxy.ServicesEvicted (informational; amount=0)
  # Raw token / native ledger (source=RAW_TRANSFER unless noted).
  # NB: no OPENING_BALANCE — opening balances are derived frontend-side via
  # archive RPC at historyFloorBlock; this indexer emits no such row.
  SAFE_SETUP_TRANSFER # First LIVE Master EOA → Master Safe inbound hop after first sighting. Fires once per Master Safe.
  MASTER_FUNDING_IN # subsequent EOA → Master Safe (after SAFE_SETUP_TRANSFER consumed)
  MASTER_WITHDRAWAL # Master Safe → EOA
  MASTER_TO_AGENT # Master Safe → Agent Safe / Agent EOA (grouped via AgentFundingEvent)
  AGENT_TO_MASTER # Agent Safe → Master Safe in native / non-OLAS token
  AGENT_OLAS_TO_MASTER # Agent Safe → Master Safe in OLAS (reward sweeps + manual returns); split out so the wallet can exclude it at query time
  AGENT_TO_APP # Agent Safe → known app contract (FPMM, Polymarket CTFExchange, etc.)
  APP_TO_AGENT # known app contract → Agent Safe (payout)
  OTHER # tracked address ↔ unmatched counterparty
}

# Best-effort disambiguator for SERVICE_BOND_DEPOSIT / SERVICE_BOND_REFUND
# rows. Both deposit-side functions emit the same event signature; same for
# the two refund functions. Attribution is done via cross-event correlation
# in the same tx with ServiceRegistryL2 events (ActivateRegistration ↔
# SECURITY_DEPOSIT; RegisterInstance ↔ AGENT_BOND; TerminateService ↔
# SECURITY_DEPOSIT-refund). Best-effort: unmodeled call orderings leave
# bondType null.
enum ServiceBondType {
  SECURITY_DEPOSIT # activateRegistrationTokenDeposit / terminateTokenRefund
  AGENT_BOND # registerAgentsTokenDeposit / unbondTokenRefund
}

enum FundsSource {
  SEMANTIC # Derived from a typed event (TokenDeposit, RewardClaimed, etc.)
  RAW_TRANSFER # Direct ERC-20 / native Transfer
}

# Write-once ledger: every FundsMovement is created and never updated. The
# only rows that were ever backfilled (SRTU bond deposit/refund) live in
# BondMovement instead — keep it that way, the handlers rely on it.
type FundsMovement @entity {
  id: ID! # `${txHash}-${logIndex}`, or a stable sub-index for synthetic rows
  service: Service
  masterSafe: MasterSafe
  agentSafe: AgentSafe
  stakingContract: StakingContract # set for STAKING_REWARD_CLAIM / UNSTAKE_REWARD / SERVICE_EVICTED rows
  epoch: BigInt # staking-side row only; from the StakingProxy event
  category: FundsCategory!
  source: FundsSource!
  agentFundingEvent: AgentFundingEvent # set for MASTER_TO_AGENT rows grouped by same-tx funding action
  token: String # token address (null for SAFE_DEPLOYED / SERVICE_EVICTED / native rows where Token entity is implicit)
  amount: BigInt! # 0 for SAFE_DEPLOYED / SERVICE_EVICTED informational rows
  from: String!
  to: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

# SRTU bond deposit / refund rows. Split out of FundsMovement because they
# are the only rows that get mutated: the SRTU producer creates the row
# serviceId/bondType-less and the matching ServiceRegistryL2 consumer
# backfills serviceId + bondType later in the same tx.
# Consumer note: a complete ledger is FundsMovement ∪ BondMovement.
type BondMovement @entity {
  id: ID! # `${txHash}-${logIndex}`
  service: Service
  masterSafe: MasterSafe
  agentSafe: AgentSafe
  category: FundsCategory! # SERVICE_BOND_DEPOSIT | SERVICE_BOND_REFUND
  source: FundsSource!
  bondType: ServiceBondType # nullable; populated when attribution succeeds
  token: String
  amount: BigInt!
  from: String!
  to: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

# Daily roll-up of OLAS rewards per service (UTC midnight bucket). Updated on
# each StakingProxy.RewardClaimed and the unstake-reward path.
type DailyServiceFunds @entity {
  id: ID! # `${serviceId}-${dayTimestamp}`
  service: Service!
  dayTimestamp: BigInt! # UTC midnight (timestamp / 86400 * 86400)
  olasRewardsClaimed: BigInt! # that day
  cumulativeOlasRewardsClaimed: BigInt!
}

# --- Service-NFT custody trail ---------------------------------------

type ServiceNftCustodyChange @entity {
  id: ID!
  service: Service!
  from: String!
  to: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: String!
}

# --- Internal helpers (not part of the public consumer contract) -----
#
# Only the two that span transactions survive the port; the per-tx bond
# queue is in-memory (see the header note).

# Reverse index used to resolve a service's multisig in event-ordering
# scenarios (CreateMultisigWithAgents → Service.multisig).
type ServiceIndex @entity {
  id: ID! # serviceId (decimal string)
  multisig: String!
}

# Buffer for RegisterInstance data that arrives before
# CreateMultisigWithAgents creates the Service entity. Drained when the
# Service is created. Spans transactions — must be persisted.
type PendingRegistration @entity {
  id: ID! # serviceId (decimal string)
  agentIds: [Int!]!
  operators: [String!]!
}

# --- Raw token / native ledger ---------------------------------------

# Token metadata snapshot. Populated lazily on first encounter,
# first-write-wins — never updated.
type Token @entity {
  id: ID! # token address
  symbol: String!
  decimals: Int!
}

# Every address we actively watch — Master/Agent Safe, Master/Agent EOA, and
# staking proxy — collapsed into one table so the hot path
# (classifyTransfer) does TWO loads per transfer (from + to) instead of six.
# Write-once: upserts early-return on an existing row and nothing mutates it.
type TrackedAddress @entity {
  id: ID! # tracked address
  role: String! # MASTER | AGENT | MASTER_EOA | AGENT_EOA | STAKING
  masterSafe: MasterSafe # null for STAKING (and any AGENT_EOA not yet linked)
  service: Service # null for MASTER / MASTER_EOA / STAKING
  firstTrackedBlock: BigInt!
}

# Running balance per (safe, token).
type TokenBalance @entity {
  id: ID! # `${safe}-${token}`
  safe: String!
  token: Token!
  balance: BigInt!
  lastUpdatedTimestamp: BigInt!
  lastUpdatedBlock: BigInt!
}

# Per-tx grouping of all Master → Agent constituent transfers for a service.
# Wallet UI renders one row per AgentFundingEvent; consumers can read raw
# FundsMovement rows via the agentFundingEvent backref for the breakdown.
type AgentFundingEvent @entity {
  id: ID! # `${txHash}-${masterSafe}-${serviceId}`
  service: Service!
  masterSafe: MasterSafe!
  txHash: String!
  blockTimestamp: BigInt!
  totalNativeAmount: BigInt! # sum across constituent native rows
  totalOlasAmount: BigInt! # sum across constituent OLAS rows
  transfers: [FundsMovement!]! @derivedFrom(field: "agentFundingEvent")
}

# --- Indexer status (new — no subgraph counterpart) -------------------

# Replaces the Graph's `_meta { block { number timestamp } }`, which
# OpenReader has no equivalent for: Subsquid exposes `squidStatus { height }`
# — a block number with no timestamp. Pearl's `computeIsDataDelayed` drives
# the stale-data indicator off a block TIMESTAMP, so the processor writes
# this singleton once per batch and the frontend maps
# `indexerStatusById(id: "1")` into its existing SubgraphMeta shape. Keeping
# the timestamp here means computeIsDataDelayed needs no changes.
type IndexerStatus @entity {
  id: ID! # always "1"
  blockNumber: BigInt!
  blockTimestamp: BigInt!
}
