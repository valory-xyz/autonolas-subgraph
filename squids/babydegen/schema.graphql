# Port of autonolas-subgraph-studio subgraphs/babydegen/babydegen-base
# (Basius on Base) as of studio #174 + #175, slice 1 of 3: service
# discovery, Safe/funding flows, token balances and token pricing.
# Positions, swaps, snapshots and population metrics arrive in slices 2 and 3.
#
# Ids and Bytes fields keep graph-node's lowercase hex output, including the
# UTF-8-encoded ids (e.g. ServiceRegistration "607" -> "0x363037"); see
# src/ids.ts. Bytes lists are String lists. BigDecimal values follow
# graph-node's 34-digit arithmetic (src/decimal.ts).

type Service @entity {
  "Service safe address"
  id: ID!
  serviceId: BigInt!
  operatorSafe: String!
  serviceSafe: String!

  latestRegistrationBlock: BigInt!
  latestRegistrationTimestamp: BigInt!
  latestRegistrationTxHash: String!

  latestMultisigBlock: BigInt!
  latestMultisigTimestamp: BigInt!
  latestMultisigTxHash: String!

  isActive: Boolean!
  createdAt: BigInt!
  updatedAt: BigInt!

  balances: [TokenBalance!]! @derivedFrom(field: "service")
  positions: [ProtocolPosition!]! @derivedFrom(field: "service")
  "ProtocolPosition ids, for iteration"
  positionIds: [String!]!
  "Agent EOAs (RegisterInstance.agentInstance); never the user side"
  agentInstances: [String!]!
}

type ServiceRegistration @entity {
  "utf8hex(serviceId)"
  id: ID!
  serviceId: BigInt!
  operatorSafe: String!
  registrationBlock: BigInt!
  registrationTimestamp: BigInt!
  registrationTxHash: String!
  "Every agentInstance registered for this serviceId"
  agentInstances: [String!]!
}

type ServiceIndex @entity {
  "utf8hex(serviceId)"
  id: ID!
  serviceId: BigInt!
  currentServiceSafe: String!
}

type AddressType @entity {
  id: ID!
  isContract: Boolean!
  "A contract that answers getThreshold(): a Safe, so the user side"
  isSafe: Boolean!
  checkedAt: BigInt!
}

type FundingBalance @entity {
  "Service safe address"
  id: ID!
  service: Service
  totalInUsd: BigDecimal!
  "Deprecated: no longer written, stays 0"
  totalOutUsd: BigDecimal!
  "Tracked tokens and ETH withdrawn to the user side, or to a contract when nothing came back in the same tx"
  totalWithdrawnUsd: BigDecimal!
  "Equals totalInUsd"
  netUsd: BigDecimal!
  firstInTimestamp: BigInt!
  lastChangeTs: BigInt!
  fundingInTxs: [String!]!
  "Deprecated: no longer written, stays empty"
  fundingOutTxs: [String!]!
}

type PriceSource @entity {
  "Feed or pool address"
  id: ID!
  token: Token!
  sourceType: String!
  priority: Int!
  isActive: Boolean!
  lastUpdate: BigInt!
  lastPrice: BigDecimal!
  confidence: BigDecimal!
}

type Token @entity {
  id: ID!
  symbol: String!
  name: String!
  decimals: BigInt!
  derivedUSD: BigDecimal!
  "PriceSource ids (graph-node returned the entities)"
  priceSources: [String!]!
  lastPriceUpdate: BigInt!
  priceConfidence: BigDecimal!
  "derivedUSD is the last valid price, not a fresh one"
  priceStale: Boolean!
  "A stablecoin last priced below the depeg threshold"
  depegged: Boolean!
}

type PriceUpdate @entity {
  "token address ++ utf8hex(timestamp)"
  id: ID!
  token: Token!
  priceUSD: BigDecimal!
  source: PriceSource!
  confidence: BigDecimal!
  timestamp: BigInt!
  "Always 0, as in the subgraph"
  block: BigInt!
}

type AgentPortfolio @entity {
  "Service safe address"
  id: ID!
  service: Service!

  finalValue: BigDecimal!
  finalValueWithoutRewards: BigDecimal!
  initialValue: BigDecimal!
  positionsValue: BigDecimal!
  uninvestedValue: BigDecimal!
  totalWithdrawnUsd: BigDecimal!

  unrealisedPnL: BigDecimal!
  roi: BigDecimal!
  apr: BigDecimal!
  projectedUnrealisedPnL: BigDecimal!

  unrealisedPnLWithRewards: BigDecimal!
  projectedUnrealisedPnLWithRewards: BigDecimal!

  ethAdjustedRoi: BigDecimal!
  ethAdjustedApr: BigDecimal!
  ethAdjustedUnrealisedPnL: BigDecimal!
  ethAdjustedProjectedUnrealisedPnL: BigDecimal!

  firstFundingEthPrice: BigDecimal!
  currentEthPrice: BigDecimal!

  totalInvestments: BigDecimal!
  totalGrossGains: BigDecimal!
  totalCosts: BigDecimal!

  firstTradingTimestamp: BigInt!
  lastUpdated: BigInt!
  lastSnapshotTimestamp: BigInt!
  lastSnapshotBlock: BigInt!

  totalPositions: Int!
  totalClosedPositions: Int!
}

type TokenBalance @entity {
  "utf8hex('<serviceSafe>-<token>')"
  id: ID!
  service: Service!
  token: String!
  symbol: String!
  decimals: Int!
  balance: BigDecimal!
  balanceUSD: BigDecimal!
  lastUpdated: BigInt!
  lastBlock: BigInt!
}

type ServiceRegistry @entity {
  "utf8hex('registry') - singleton"
  id: ID!
  serviceAddresses: [String!]!
}

"""
CL: utf8hex('<agent>-<protocol>-<tokenId>'), v2: utf8hex('<agent>-<protocol>-<pool>')
"""
type ProtocolPosition @entity {
  id: ID!
  agent: String! @index
  service: Service
  "aerodrome-cl, aerodrome-v2, aero-cl or aero-v2"
  protocol: String! @index
  pool: String!

  isActive: Boolean!

  usdCurrent: BigDecimal!
  usdCurrentWithRewards: BigDecimal!
  token0: String
  token0Symbol: String
  amount0: BigDecimal
  amount0USD: BigDecimal!
  token1: String
  token1Symbol: String
  amount1: BigDecimal
  amount1USD: BigDecimal!
  liquidity: BigInt

  claimableReward: BigDecimal
  claimableRewardUSD: BigDecimal

  "Fee part of Collect in token0, principal excluded"
  collectedFees0: BigDecimal!
  collectedFees1: BigDecimal!
  collectedFeesUSD: BigDecimal!
  "Reward token units: legacy AERO or Aero's AERO"
  claimedRewards: BigDecimal!
  claimedRewardsUSD: BigDecimal!

  tokenId: BigInt!
  rewardsContract: String

  tickLower: Int!
  tickUpper: Int!
  tickSpacing: Int
  fee: Int

  entryTxHash: String!
  entryTimestamp: BigInt!
  entryAmount0: BigDecimal!
  entryAmount0USD: BigDecimal!
  entryAmount1: BigDecimal!
  entryAmount1USD: BigDecimal!
  entryAmountUSD: BigDecimal!

  exitTxHash: String
  exitTimestamp: BigInt
  exitAmount0: BigDecimal
  exitAmount0USD: BigDecimal
  exitAmount1: BigDecimal
  exitAmount1USD: BigDecimal
  exitAmountUSD: BigDecimal

  totalCostsUSD: BigDecimal!
  swapSlippageUSD: BigDecimal!

  investmentUSD: BigDecimal!
  grossGainUSD: BigDecimal!
  netGainUSD: BigDecimal!
  positionROI: BigDecimal!
}

"A v2 LP mint waiting for its Mint event (a String id in the subgraph too)"
type PendingMintPosition @entity {
  "'<txHash>-<pool>'"
  id: ID!
  txHash: String!
  poolAddress: String!
  positionId: String!
  recipient: String!
  "The LP mint found the row missing or closed: its Mint replaces the entry"
  startsEntry: Boolean!
}

type SwapTransaction @entity {
  "txHash ++ utf8hex('-' + logIndex)"
  id: ID!
  agent: String!
  transactionId: String!
  txHash: String!
  timestamp: BigInt!
  block: BigInt!
  fromAssetId: String!
  toAssetId: String!
  fromAmount: BigInt!
  toAmount: BigInt!
  fromAmountUSD: BigDecimal!
  toAmountUSD: BigDecimal!
  expectedToAmountUSD: BigDecimal!
  slippageUSD: BigDecimal!
  slippagePercentage: BigDecimal!
  isAssociated: Boolean!
  expiresAt: BigInt!
}

type AgentSwapBuffer @entity {
  "Service safe address"
  id: ID!
  agent: String!
  bucket0Swaps: String!
  bucket1Swaps: String!
  bucket2Swaps: String!
  bucket3Swaps: String!
  totalSlippageUSD: BigDecimal!
  lastUpdated: BigInt!
  currentBucketIndex: BigInt!
}

type NFTPositionMapping @entity {
  "utf8hex('<protocol>-<tokenId>')"
  id: ID!
  positionId: String!
  protocol: String!
}

"Principal released by DecreaseLiquidity and not yet collected"
type UncollectedPrincipal @entity {
  "utf8hex('<protocol>-<tokenId>')"
  id: ID!
  amount0: BigInt!
  amount1: BigInt!
}

"A position's claimableReward as it stood before the first refresh in a block"
type ClaimableRewardBeforeBlock @entity {
  "ProtocolPosition id"
  id: ID!
  block: BigInt!
  claimableReward: BigDecimal!
}

"Reward claim logs already credited to a position"
type CreditedRewardClaim @entity {
  "txHash ++ logIndex as 4 little-endian bytes (graph-ts concatI32)"
  id: ID!
}

"Aero pool -> gauge, from GaugeManager GaugeCreated"
type AeroGauge @entity {
  "pool"
  id: ID!
  gauge: String!
  createdAtBlock: BigInt!
}

"Venue of a v2 pool, written by the Aero factory handler that created it (and its AeroV2Pool template)"
type V2PoolVenue @entity {
  "pool"
  id: ID!
  protocol: String!
  stable: Boolean!
}

# --- squid-only ---------------------------------------------------------

"""
One row per Aerodrome v2 pool the subgraph attached a `VeloV2Pool` template
to: the LpSugar bootstrap at the start block and whitelisted PoolFactory
PoolCreated after it. (`AeroV2Pool` templates are the V2PoolVenue rows.)
"""
type VeloV2PoolDataSource @entity {
  id: ID!
  createdAtBlock: BigInt!
}


"""
One row per address the subgraph attached a `Safe` template to (service and
operator safes). The processor rebuilds its log filters from this table and
Service at every (re)start; see src/sources.ts.
"""
type SafeDataSource @entity {
  id: ID!
  createdAtBlock: BigInt!
}
