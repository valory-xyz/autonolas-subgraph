version: '3'
services:
  
  graph-node:
    image: graphprotocol/graph-node
    ports:
      - '8000:8000'
      - '8001:8001'
      - '8020:8020'
      - '8030:8030'
      - '8040:8040'
    depends_on:
      - postgres
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: ${IPFS_URL:-https://registry.autonolas.tech}
      ethereum: 'mainnet:${RPC_URL:-http://host.docker.internal:8545}'
      GRAPH_LOG: ${GRAPH_LOG:-debug}
      GRAPH_ALLOW_NON_DETERMINISTIC_IPFS: 'true'
      GRAPH_START_BLOCK: ${GRAPH_START_BLOCK:-0}
      GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER: ${GRAPH_ETHEREUM_GENESIS_BLOCK_NUMBER:-0}
      ETHEREUM_POLLING_INTERVAL: ${ETHEREUM_POLLING_INTERVAL:-1000}
  
  postgres:
    image: postgres
    ports:
      - '5432:5432'
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements"
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  autonolas-subgraph:
    build: .
    restart: on-failure
    environment:
      CHAIN: ${CHAIN:-staging}
      IPFS_REGISTRY: ${IPFS_URL:-https://registry.autonolas.tech}
      SUBGRAPH_NODE: "http://graph-node:8020"
    depends_on:
      - graph-node
