specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  # Component Registry
  - kind: ethereum
    name: ComponentRegistry
    network: mainnet
    source:
      address: "0x7Fd1F4b764fA41d19fe3f63C85d12bf64d2bbf68"
      abi: ComponentRegistry
      startBlock: 7344700
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateUnit
      abis:
        - name: ComponentRegistry
          file: ./abis/ComponentRegistry.json
      eventHandlers:
        - event: CreateUnit(uint256,uint8,bytes32)
          handler: handleCreateComponent
      file: ./src/registry.ts

  # Agent Registry
  - kind: ethereum
    name: AgentRegistry
    network: mainnet
    source:
      address: "0xEB5638eefE289691EcE01943f768EDBF96258a80"
      abi: AgentRegistry
      startBlock: 7344700
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateUnit
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: CreateUnit(uint256,uint8,bytes32)
          handler: handleCreateAgent
      file: ./src/registry.ts
 
  # Service Registry
  - kind: ethereum
    name: ServiceRegistry
    network: mainnet
    source:
      address: "0x1cEe30D08943EB58EFF84DD1AB44a6ee6FEff63a"
      abi: ServiceRegistry
      startBlock: 7344700
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CreateService
      abis:
        - name: ServiceRegistry
          file: ./abis/ServiceRegistry.json
      eventHandlers:
        - event: CreateService(indexed uint256)
          handler: handleCreateService
      file: ./src/registry.ts
features:
  - fullTextSearch
  - ipfsOnEthereumContracts
